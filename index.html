<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3v.fi - Discord Timestamp Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-body">
      <div class="container">
        <span>
          <h2>Discord Timestamp Generator</h2>
          <p id="description">
            Get a dynamic date-time display in your Discord messages. Choose
            your time and copy the code below.
          </p>
        </span>
      </div>
      <div class="container">
        <span>Date</span>
        <input type="date" id="d" />
        <span>Time</span>
        <input type="time" id="hm" />
        <span>Type</span>
        <select id="t">
          <option value="t">short time</option>
          <option value="T">long time</option>
          <option value="d">short date</option>
          <option value="D">long date</option>
          <option value="f">long date with short time</option>
          <option value="F">long date with day of week and short time</option>
          <option value="R" selected>relative</option>
        </select>
        <span>Output</span>
        <div class="output-container">
          <input
            type="text"
            readonly
            id="code"
            title="Press Ctrl/Cmd+C to copy"
          />
          <button id="copy">Copy</button>
        </div>
        <span id="preview"></span>

        <button id="current">Reset to current time</button>
      </div>
      <div id="copied-notification" style="display: none">
        Copied to clipboard!
      </div>

      <script src = 'script.js'></script>
        
      </script>
    </div>
  </body>
</html>
